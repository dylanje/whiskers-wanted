name: Deploy to Host
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.DREAMHOST_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DREAMHOST_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          TARGET: ${{ secrets.DREAMHOST_USER }}@${{ secrets.DREAMHOST_HOST }}:whiskerswanted.com/
        run: |
          rsync -az --delete \
            --exclude '.git*' --exclude '.github/' \
            --exclude 'README.md' --exclude '.well-known/' \
            -e "ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes -v" \
            ./ "$TARGET"
